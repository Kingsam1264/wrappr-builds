name: wrappr-build

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Wrappr job id
        required: true
        type: string
      url:
        description: Website URL
        required: true
        type: string
      app_name:
        description: App display name
        required: true
        type: string
      platforms:
        description: Comma-separated platform list (windows,linux,macos,android,ios)
        required: true
        type: string
      icon_url:
        description: Optional icon URL
        required: false
        type: string
      bundle_id:
        description: App bundle identifier
        required: false
        type: string
        default: com.wrappr.app

permissions:
  contents: write

env:
  CI: true

jobs:
  build-linux:
    if: contains(inputs.platforms, 'linux')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tw93/Pake
          path: pake-src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev libsoup-3.0-dev
      - name: Download custom icon
        if: inputs.icon_url != ''
        run: curl -L -o app_icon.png "${{ inputs.icon_url }}"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Pake CLI
        run: npm install -g pnpm pake-cli
      - name: Patch Pake config
        run: node scripts/gh-patch-pake.mjs pake-src "${{ inputs.url }}" "${{ inputs.app_name }}" "${{ inputs.bundle_id }}"
      - name: Build Linux app
        working-directory: pake-src
        run: |
          if [ -f "../app_icon.png" ]; then
            pnpm install && pake "${{ inputs.url }}" --name "${{ inputs.app_name }}" --identifier "${{ inputs.bundle_id }}" --targets deb,appimage --icon ../app_icon.png
          else
            pnpm install && pake "${{ inputs.url }}" --name "${{ inputs.app_name }}" --identifier "${{ inputs.bundle_id }}" --targets deb,appimage
          fi
      - name: Collect Linux artifacts
        run: |
          mkdir -p out
          find pake-src -maxdepth 3 \( -name '*.deb' -o -name '*.AppImage' \) -exec cp {} out/ \;
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.job_id }}
          name: Build ${{ inputs.app_name }} (${{ inputs.job_id }})
          draft: false
          prerelease: false
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    if: contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tw93/Pake
          path: pake-src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download custom icon
        if: inputs.icon_url != ''
        shell: pwsh
        run: Invoke-WebRequest -Uri "${{ inputs.icon_url }}" -OutFile "app_icon.png"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Pake CLI
        run: npm install -g pnpm pake-cli
      - name: Patch Pake config
        run: node scripts/gh-patch-pake.mjs pake-src "${{ inputs.url }}" "${{ inputs.app_name }}" "${{ inputs.bundle_id }}"
      - name: Build Windows app
        working-directory: pake-src
        shell: pwsh
        run: |
          if (Test-Path "../app_icon.png") {
            pnpm install; pake "${{ inputs.url }}" --name "${{ inputs.app_name }}" --identifier "${{ inputs.bundle_id }}" --icon ../app_icon.png
          } else {
            pnpm install; pake "${{ inputs.url }}" --name "${{ inputs.app_name }}" --identifier "${{ inputs.bundle_id }}"
          }
      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem -Path pake-src -Recurse -Include *.exe,*.msi | Where-Object { $_.FullName -notlike "*node_modules*" } | Copy-Item -Destination out
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.job_id }}
          name: Build ${{ inputs.app_name }} (${{ inputs.job_id }})
          draft: false
          prerelease: false
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    if: contains(inputs.platforms, 'macos')
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tw93/Pake
          path: pake-src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download custom icon
        if: inputs.icon_url != ''
        run: curl -L -o app_icon.png "${{ inputs.icon_url }}"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Pake CLI
        run: npm install -g pnpm pake-cli
      - name: Patch Pake config
        run: node scripts/gh-patch-pake.mjs pake-src "${{ inputs.url }}" "${{ inputs.app_name }}" "${{ inputs.bundle_id }}"
      - name: Build macOS app
        working-directory: pake-src
        run: |
          if [ -f "../app_icon.png" ]; then
            pnpm install && pake "${{ inputs.url }}" --name "${{ inputs.app_name }}" --identifier "${{ inputs.bundle_id }}" --targets dmg --icon ../app_icon.png
          else
            pnpm install && pake "${{ inputs.url }}" --name "${{ inputs.app_name }}" --identifier "${{ inputs.bundle_id }}" --targets dmg
          fi
      - name: Collect macOS artifacts
        run: |
          mkdir -p out
          find pake-src -maxdepth 3 -name '*.dmg' -exec cp {} out/ \;
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.job_id }}
          name: Build ${{ inputs.app_name }} (${{ inputs.job_id }})
          draft: false
          prerelease: false
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    if: contains(inputs.platforms, 'android')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tw93/Pake
          path: pake-src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev libsoup-3.0-dev
      - name: Download custom icon
        if: inputs.icon_url != ''
        run: curl -L -o app_icon.png "${{ inputs.icon_url }}"
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          local-cache: true
      - name: Patch Pake config
        run: node scripts/gh-patch-pake.mjs pake-src "${{ inputs.url }}" "${{ inputs.app_name }}" "${{ inputs.bundle_id }}"
      - name: Install Pake dependencies
        working-directory: pake-src
        run: pnpm install
      - name: Generate mobile icons
        if: inputs.icon_url != ''
        working-directory: pake-src
        run: pnpm exec tauri icon ../app_icon.png
      - name: Build Android APK
        working-directory: pake-src
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CI: true
        run: |
          pnpm exec tauri android init --ci
          pnpm exec tauri android build
      - name: Collect Android artifacts
        run: |
          mkdir -p out
          
          # Find the unsigned APK and release AAB
          unsigned_apk=$(find pake-src -type f -name '*release-unsigned.apk' | head -n 1)
          release_aab=$(find pake-src -type f -name '*release.aab' | head -n 1)
          
          if [ -n "$unsigned_apk" ]; then
            echo "Generating keystore..."
            keytool -genkey -v -keystore release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            
            echo "Locating apksigner..."
            sdk_path=${ANDROID_HOME:-/usr/local/lib/android/sdk}
            apksigner_path=$(find $sdk_path/build-tools -name apksigner | sort -V | tail -n 1)
            
            echo "Signing APK..."
            $apksigner_path sign --ks release.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "out/${{ inputs.app_name }}.apk" "$unsigned_apk"
            echo "Signed APK created at out/${{ inputs.app_name }}.apk"
          else
            echo "Error: Unsigned APK not found!"
          fi
          
          if [ -n "$release_aab" ]; then
            cp "$release_aab" "out/${{ inputs.app_name }}.aab"
            echo "Copied AAB to out/${{ inputs.app_name }}.aab"
          fi
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.job_id }}
          name: Build ${{ inputs.app_name }} (${{ inputs.job_id }})
          draft: false
          prerelease: false
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    if: contains(inputs.platforms, 'ios')
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tw93/Pake
          path: pake-src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: Download custom icon
        if: inputs.icon_url != ''
        run: curl -L -o app_icon.png "${{ inputs.icon_url }}"
      - name: Patch Pake config
        run: node scripts/gh-patch-pake.mjs pake-src "${{ inputs.url }}" "${{ inputs.app_name }}" "${{ inputs.bundle_id }}"
      - name: Install Pake dependencies
        working-directory: pake-src
        run: pnpm install
      - name: Generate mobile icons
        if: inputs.icon_url != ''
        working-directory: pake-src
        run: pnpm exec tauri icon ../app_icon.png
      - name: Build iOS (simulator IPA)
        working-directory: pake-src
        env:
          CI: true
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""
        run: |
          pnpm exec tauri ios init --ci
          pnpm exec tauri ios build --ci --target aarch64-sim -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Collect iOS artifacts
        run: |
          mkdir -p out
          find pake-src -name '*.app' -type d -exec cp -R {} out/ \; 2>/dev/null || true
          find pake-src -name '*.ipa' -type f -exec cp {} out/ \; 2>/dev/null || true
          cd out
          for d in *.app; do
            if [ -d "$d" ]; then
              zip -r "${d}.zip" "$d"
              rm -rf "$d"
            fi
          done
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.job_id }}
          name: Build ${{ inputs.app_name }} (${{ inputs.job_id }})
          draft: false
          prerelease: false
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
